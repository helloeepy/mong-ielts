<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="config.js"></script><title>Mong IELTS Companion</title>
<style>
:root{--bg:#f6f0e4;--sf:#fffaf0;--tx:#3b2f25;--mu:#7a6d5f;--sg:#7d8a5e;--pe:#f2c3a0;--or:#d9863f;--bd:#e6dcc8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1f1b16;--sf:#2a251e;--tx:#f1e8d6;--mu:#a99d8a;--sg:#9bab76;--bd:#3d362b;color-scheme:dark}}
:root[data-theme=dark]{--bg:#1f1b16;--sf:#2a251e;--tx:#f1e8d6;--mu:#a99d8a;--sg:#9bab76;--bd:#3d362b;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Georgia,'Times New Roman',serif}
main{max-width:560px;margin:0 auto;padding:16px 16px 96px}
h1,h2,h3{font-weight:600;margin:.2em 0}h2{font-size:1.3rem}h3{font-size:1rem}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 2px 8px #0000000f}
.mu{color:var(--mu);font-size:.9rem}
button,input,select{font:inherit;color:var(--tx)}
button{background:var(--sg);color:#fff;border:0;border-radius:12px;padding:10px 14px;cursor:pointer}
button.alt{background:transparent;color:var(--tx);border:1px solid var(--bd)}
input{background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:10px;width:100%;margin:4px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--sf);border-top:1px solid var(--bd);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;color:var(--mu);font-size:.78rem;padding:8px 2px;border-radius:10px}
nav button.on{color:var(--sg);font-weight:700}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--sg)}
.opt{display:block;width:100%;text-align:left;margin:6px 0;background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
.ok{border-color:var(--sg)!important}.no{border-color:var(--or)!important}
.mong{display:flex;gap:12px;align-items:center}.mong img{flex:none}
.bubble{background:var(--bg);border-radius:14px;padding:10px 12px;font-style:italic}
@media(prefers-reduced-motion:no-preference){.mong img{animation:br 4s ease-in-out infinite}@keyframes br{50%{transform:scale(1.03)}}}
#tb,#bn{display:none}#nav{display:none!important}
#sb{position:fixed;top:0;bottom:0;left:-260px;width:250px;background:var(--sf);border-right:1px solid var(--bd);padding:calc(10px + env(safe-area-inset-top,0px)) 10px 10px;z-index:40;transition:left .2s;overflow-y:auto}
.open #sb{left:0}#sc{display:none;position:fixed;inset:0;background:#0006;z-index:30}.open #sc{display:block}
#tb{display:flex;position:sticky;top:0;z-index:20;background:var(--sf);border-bottom:1px solid var(--bd);padding:8px 12px;align-items:center;gap:12px}
#bn{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--sf);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:20}
#bn button{flex:1;background:none;color:var(--mu);font-size:.95rem;padding:12px 2px}#bn button.on{color:var(--sg);font-weight:700}
.mi{display:block;width:100%;text-align:left;background:none;color:var(--tx);padding:14px 12px;font-size:1.02rem;border-radius:12px}.mi.on{background:var(--bg);color:var(--sg);font-weight:700}
.rel{position:relative}.pop{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:6px;margin:4px 0 4px 12px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}.tile{min-height:96px;font-size:1.1rem;border-radius:20px}.tile small{display:block;font-weight:normal;font-size:.8rem;opacity:.9;margin-top:4px}.tile.b{background:#b8692a}
button:active{transform:scale(.97)}
@media(min-width:800px){#tb,#bn,#sc{display:none!important}#sb{left:0;width:232px;overflow:visible}.pop{position:absolute;left:100%;top:0;width:190px;margin:0 0 0 8px;box-shadow:0 6px 20px #00000026}main{margin:0 0 0 240px;max-width:none}#app{max-width:700px}}
</style></head><body><main id="app"></main>

function mong(mood="idle",sz=96){const m=MONG[mood]||MONG.idle;return `<img src="${m}" height="${sz}" alt="Mong the calico cat, ${mood}" style="width:auto;flex:none">`}
function greet(){const h=new Date().getHours();return h<5?"Still up? Maybe a tiny session, then sleep.":h<12?"Good morning. One small step is enough today.":h<18?"Hello! Shall we study a little?":"Good evening. Gentle review tonight?"}
function home(){const m=S.log[day()]||0;
 return `<div class="card"><div class="mong">${mong(m?"happy":"sleeping")}<div class="bubble">${m?`${m} min done today. I’m proud of you.`:greet()}</div></div></div>
 <div class="card"><h2>Today</h2><p class="mu">Streak: <b>${S.streak}</b> day${S.streak==1?"":"s"} · Minutes today: <b>${m}</b></p>
 <p class="mu">Low energy? Even one quiz or one new word counts.</p>
 <div class="row"><button onclick="go('practice')">Quick quiz</button><button class="alt" onclick="go('vocab')">Review words</button></div></div>
 <div class="card"><h3>Transfer progress (no account needed)</h3><p class="mu">On the device with the latest progress, press Copy code and send it to yourself (WhatsApp or Notes). On the other device, paste it here and press Use code.</p><textarea id="tcode" rows="3" placeholder="Paste sync code here" style="width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:10px;font:inherit"></textarea><div class="row"><button onclick="copyCode()">Copy code</button><button class="alt" onclick="useCode()">Use code</button><button class="alt" onclick="shareFile()">Send backup file</button></div></div><div class="card"><h3>Your data</h3><div class="row"><button class="alt" onclick="exp()">Export</button><label class="alt" style="border:1px solid var(--bd);border-radius:12px;padding:10px 14px;cursor:pointer">Restore<input type="file" accept=".json" hidden onchange="imp(event)"></label><button class="alt" onclick="thm()">Theme</button><button class="alt" onclick="wipe()">Reset</button></div></div>`}
function practice(){
 let h="";
 if(!qdone){const q=Q[qi];h=`<div class="card"><p class="mu">Question ${qi+1} of ${Q.length}</p><h3>${esc(q[0])}</h3>${q[1].map((o,i)=>`<button class="opt ${ans!==null?(i===q[2]?"ok":i===ans?"no":""):""}" ${ans!==null?"disabled":""} onclick="pick(${i})">${esc(o)}</button>`).join("")}${ans!==null?`<p class="mu">${esc(q[3])}</p><button onclick="nextQ()">${qi+1<Q.length?"Next":"Finish"}</button>`:""}</div>`}
 else h=`<div class="card"><div class="mong">${mong(qs>=4?"proud":"encouraging"==="x"?"":"happy")}<div class="bubble">You scored ${qs}/${Q.length}. Wrong answers are saved in Progress.</div></div><button onclick="qi=0;qs=0;ans=null;qdone=false;draw()">Again</button></div>`;
 const mm=Math.floor(left/60),ss=String(left%60).padStart(2,"0");
 return `<h2>Practice</h2>${h}<div class="card"><h3>Focus timer</h3><p style="font-size:2rem;margin:.2em 0">${tm?`${mm}:${ss}`:"Ready"}</p><div class="row">${tm?`<button class="alt" onclick="stopT()">Stop</button>`:[10,25,45].map(n=>`<button onclick="startT(${n})">${n} min</button>`).join("")}</div></div>`}
function pick(i){ans=i;const q=Q[qi];if(i===q[2])qs++;else{S.mist.unshift({q:q[0],a:q[1][i],c:q[1][q[2]],n:q[3]});S.mist=S.mist.slice(0,50)}save();draw()}
function nextQ(){ans=null;if(qi+1<Q.length)qi++;else{qdone=true;touch(3)}draw()}
function startT(n){tdur=n;left=n*60;tm=setInterval(()=>{left--;if(left<=0){clearInterval(tm);tm=null;touch(tdur);alert("Session complete. Well done.")}if(tab==="practice")draw()},1000);draw()}
function stopT(){clearInterval(tm);const done=Math.floor((tdur*60-left)/60);tm=null;if(done>0)touch(done);draw()}
function progress(){const d=[...Array(7)].map((_,i)=>day(6-i));const v=d.map(k=>S.log[k]||0),mx=Math.max(10,...v);
 const bars=v.map((x,i)=>{const h=Math.round(x/mx*90);return `<rect x="${i*44+8}" y="${100-h}" width="30" height="${h}" rx="6" fill="var(--sg)"/><text x="${i*44+23}" y="116" font-size="10" text-anchor="middle" fill="var(--mu)">${d[i].slice(8)}</text>`}).join("");
 return `<h2>Progress</h2><div class="card"><h3>Minutes, last 7 days</h3><svg viewBox="0 0 316 122" width="100%" role="img" aria-label="Study minutes per day">${bars}</svg><p class="mu">Total: ${v.reduce((a,b)=>a+b,0)} min · Streak: ${S.streak}</p></div>
 <div class="card"><h3>Mistake notebook</h3>${S.mist.length?S.mist.map(m=>`<p><b>${esc(m.q)}</b><br><span class="mu">You: ${esc(m.a)} · Answer: ${esc(m.c)}<br>${esc(m.n)}</span></p>`).join(""):`<div class="mong">${mong("sleeping",64)}<p class="mu">No mistakes yet. Mong is napping.</p></div>`}${S.mist.length?`<button class="alt" onclick="S.mist=[];save();draw()">Clear</button>`:""}</div>`}
function vocab(){const v=S.vocab;let rev="";
 if(v.length){const w=v[card%v.length];rev=`<div class="card" style="text-align:center"><p class="mu">Card ${card%v.length+1} of ${v.length}</p><h2>${flip?esc(w.m):esc(w.w)}</h2>${flip&&w.e?`<p class="mu"><i>${esc(w.e)}</i></p>`:""}<div class="row" style="justify-content:center"><button class="alt" onclick="flip=!flip;draw()">Flip</button><button onclick="card++;flip=false;touch(1);draw()">Next</button></div></div>`}
 else rev=`<div class="card mong">${mong("idle",64)}<p class="mu">Add your first word below.</p></div>`;
 return `<h2>Vocabulary</h2>${rev}<div class="card"><h3>Add a word</h3><input id="w" placeholder="Word"><input id="m" placeholder="Meaning"><input id="e" placeholder="Example sentence (optional)"><button onclick="addW()">Save word</button></div>
 ${v.length?`<div class="card"><h3>All words</h3>${v.map((w,i)=>`<div class="row" style="justify-content:space-between"><span><b>${esc(w.w)}</b> <span class="mu">${esc(w.m)}</span></span><button class="alt" onclick="if(confirm('Delete this word?')){S.vocab.splice(${i},1);save();draw()}">✕</button></div>`).join("")}</div>`:""}`}
function addW(){const w=$("#w").value.trim(),m=$("#m").value.trim();if(!w||!m)return alert("Please enter a word and its meaning.");S.vocab.unshift({w,m,e:$("#e").value.trim()});touch(1);draw()}
function fund(){const f=S.fund,p=Math.min(100,Math.round(f.saved/(f.goal||1)*100));
 return `<h2>IELTS Fund</h2><div class="card"><div class="mong">${mong(p>=100?"proud":"happy",72)}<div class="bubble">${p>=100?"You did it. Time to book the exam!":"Little by little, the exam fee gets closer."}</div></div><h3>${idr(f.saved)} <span class="mu">of ${idr(f.goal)}</span></h3><div class="bar"><i style="width:${p}%"></i></div><p class="mu">${p}% saved</p></div>
 <div class="card"><h3>Add savings</h3><input id="amt" type="number" inputmode="numeric" placeholder="Amount (IDR)"><button onclick="dep()">Add</button></div>
 <div class="card"><h3>Exam fee goal</h3><input id="goal" type="number" inputmode="numeric" value="${f.goal}"><button class="alt" onclick="S.fund.goal=+$('#goal').value||0;save();draw()">Update goal</button></div>
 ${f.deps.length?`<div class="card"><h3>History</h3>${f.deps.slice(0,15).map(d=>`<p class="mu">${d.d} · ${idr(d.a)}</p>`).join("")}</div>`:""}`}
function dep(){const a=+$("#amt").value;if(!(a>0))return alert("Enter a positive amount.");S.fund.saved+=a;S.fund.deps.unshift({d:day(),a});save();draw()}
function exp(){const b=new Blob([JSON.stringify(S)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="mong-backup.json";a.click()}
function imp(e){const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{S={...def(),...JSON.parse(t)};save();draw()}catch(x){alert("That file couldn’t be read.")}})}
function wipe(){if(confirm("Erase all data? This can’t be undone.")){S=def();save();draw()}}
function thm(){const d=document.documentElement,cur=d.dataset.theme||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");d.dataset.theme=cur==="dark"?"light":"dark";S.dark=d.dataset.theme;save()}
const $=s=>document.querySelector(s);
const T=[["home","Home"],["practice","Practice"],["progress","Progress"],["vocab","Vocab"],["write","Write"],["fund","Fund"]];
function go(t){tab=t;draw()}
function draw(){$("#app").innerHTML={home,practice,progress,vocab,write,fund}[tab]();$("#nav").innerHTML=T.map(([k,l])=>`<button class="${k===tab?"on":""}" onclick="go('${k}')">${l}</button>`).join("")}

${f.deps.length?`<div class="card"><h3>Transactions</h3>${f.deps.slice(0,20).map(d=>`<p class="mu">${d.d} · ${d.t==="out"?"−":"+"}${idr(d.a)}${d.n?" · "+esc(d.n):""}</p>`).join("")}</div>`:""}`}
function tx(t,a,n=""){if(!(a>0))return alert("Enter a positive amount.");if(t==="out"){if(a>S.fund.saved)return alert("That is more than your balance.");if(!confirm("Record this withdrawal?"))return}S.fund.saved+=t==="in"?a:-a;S.fund.deps.unshift({d:day(),t,a,n});save();draw()}
function calc(){const m=+$("#mo").value,r=Math.max(0,S.fund.goal-S.fund.saved);if(!(m>0))return;const n=Math.ceil(r/m),d=new Date();d.setMonth(d.getMonth()+n);$("#co").textContent=r?`About ${n} month(s), around ${d.toLocaleDateString("en-GB",{month:"long",year:"numeric"})}.`:"Target already reached."}

const WP=[["Task 2","Some people think universities should focus on job skills, while others believe academic knowledge matters more. Discuss both views and give your opinion."],["Task 2","Many cities are introducing congestion charges. Do the advantages outweigh the disadvantages?"],["Task 2","Some argue that remote work harms team creativity. To what extent do you agree or disagree?"],["Task 1","Average weekly study hours by year group: Year 7: 5, Year 9: 8, Year 11: 12, Year 13: 18. Summarise the information by selecting and reporting the main features."],["Task 1","Café visits per week by age group: 18–25: 3.2; 26–40: 2.1; 41–60: 1.4; 60+: 0.8. Summarise and make comparisons where relevant."]];

return `<h2>Writing Lab</h2><div class="card"><div class="row">${WP.map((_,i)=>`<button class="${i===wi?"":"alt"}" onclick="wi=${i};draw()">${i+1}</button>`).join("")}</div><p class="mu">${p[0]} · ${t} min · minimum ${min} words</p><p>${esc(p[1])}</p><textarea id="wa" rows="12" style="width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:10px;font:inherit" oninput="wsv(${min})">${esc(S.drafts["d"+wi]||"")}</textarea><p class="mu"><span id="wc">0</span> words · <span id="wtm">${wt?"":t+":00"}</span></p><div class="row"><button onclick="startW(${t})">Start timer</button><button class="alt" onclick="subW()">Save submission</button></div><p class="mu">Drafts autosave. This version has no AI scoring, so check yourself: Is there an overview (Task 1) or a clear position (Task 2)? Are paragraphs organised? Any repeated words?</p></div>
<div class="card"><h3>History</h3>${S.subs.length?S.subs.map((s,i)=>`<div class="row" style="justify-content:space-between"><span class="mu">${s.d} · ${s.p} · ${s.w} words</span><button class="alt" onclick="if(confirm('Delete this submission?')){S.subs.splice(${i},1);save();draw()}">✕</button></div>`).join(""):`<div class="mong">${mong("sleeping",56)}<p class="mu">Nothing yet. Your first essay will appear here.</p></div>`}</div>`}
function wsv(min){const a=$("#wa");if(!a)return;S.drafts["d"+wi]=a.value;save();const n=wcount(a.value),c=$("#wc");c.textContent=n;c.style.color=n<min?"var(--or)":"var(--sg)"}
function startW(t){if(wt)clearInterval(wt);wdur=t;wleft=t*60;wt=setInterval(()=>{wleft--;const e=$("#wtm");if(e)e.textContent=Math.floor(wleft/60)+":"+String(wleft%60).padStart(2,"0");if(wleft<=0){clearInterval(wt);wt=null;alert("Time is up.")}},1000)}
function subW(){const a=$("#wa"),n=wcount(a.value);if(n<20)return alert("Write a little more before saving.");const mins=wdur?Math.round((wdur*60-wleft)/60):0;if(wt){clearInterval(wt);wt=null}wdur=0;S.subs.unshift({d:day(),p:WP[wi][0],w:n,t:a.value});S.drafts["d"+wi]="";touch(Math.max(mins,1));draw()}
if(S.dark)document.documentElement.dataset.theme=S.dark;

const NAVM=[["home","Home"],["practice","Practice",[["quiz","Quiz"],["speak","Speaking"],["write","Writing"]]],["vocab","Vocabulary"],["progress","Progress"],["fund","IELTS Fund"],["settings","Settings"]];
let sub=false,drawer=false,qz=null,sp=0,sq=0,st=null,sl=0,sph="",rec=null,chunks=[],vf=false,sb=null,user=null,pushT=null,syncMsg="",AC=null;

const QB=[

["G","By 2030, the city ___ its emissions by half.",["will reduce","will have reduced","reduces"],1,"Future perfect: finished before a future time."],
["G","Which sentence is correct?",["Despite of the rain, we went.","Despite the rain, we went.","Despite it rained, we went."],1,"Despite is followed directly by a noun or -ing form."],
["G","The report, ___ was published in 2020, changed the policy.",["that","which","what"],1,"Extra information between commas uses which."],
["G","He has lived here ___ 2015.",["for","since","from"],1,"since + starting point; for + length of time."],
["G","People ___ exercise regularly tend to live longer.",["who","whom","which"],0,"Use who for people as the subject."],
["G","Not only ___ the exam difficult, but it was also long.",["was","did","is"],0,"Inversion after Not only: Not only was the exam..."],
["G","If governments ___ earlier, the damage would have been smaller.",["acted","had acted","would act"],1,"Third conditional: if + past perfect."],

["V","“Ubiquitous” means:",["rare","found everywhere","expensive"],1,"Smartphones are ubiquitous."],
["V","Best collocation: ___ a conclusion",["make","draw","do"],1,"Draw a conclusion; make a decision."],
["V","“Alleviate poverty” means:",["cause it","reduce it","measure it"],1,"Alleviate = make less severe."],
["V","Synonym of “crucial”:",["optional","vital","minor"],1,"Crucial = vital = extremely important."],
["V","“Sustainable” development:",["is very fast","can continue without harming resources","costs little"],1,"Sustainable = balanced for the long term."],
["R","“The museum attracts about two million visitors a year.” Statement: Most visitors are tourists.",["True","False","Not Given"],2,"The passage never says who the visitors are: Not Given."],
["R","“Solar panel prices fell by about 80% over the last decade.” Statement: Solar panels are cheaper than ten years ago.",["True","False","Not Given"],0,"A fall in price means cheaper: True."],
["R","“Students who slept eight hours scored higher than those who slept five.” Statement: Less sleep has no effect on scores.",["True","False","Not Given"],1,"The passage says the opposite: False."],

["R","“Researchers tested the drug on 200 patients.” Statement: The drug was tested on children.",["True","False","Not Given"],2,"Ages are not mentioned: Not Given."],
["R","In Matching Headings, what should you do first?",["Read every word slowly","Skim each paragraph for its main idea","Look only at the questions"],1,"Skim for the main idea, then match."],
["W","Which element must Task 1 include?",["Your opinion","An overview of the main trends","A personal story"],1,"Without an overview, your Task Achievement score is limited."],
["W","Minimum words for Task 2:",["150","250","350"],1,"Task 2 is 250 words; Task 1 is 150."],
["W","Best linker to introduce an example:",["However","For instance","Although"],1,"For instance / for example."],
["W","A strong Task 2 body paragraph has:",["many unrelated ideas","one main idea, explanation and example","only a list of facts"],1,"Point, explain, example, link."],
["W","In Speaking Part 2 you talk for about:",["30 seconds","1 to 2 minutes","5 minutes"],1,"You prepare for 1 minute and speak up to 2 minutes."],
["W","A good Speaking Part 1 answer is:",["Yes.","a short answer, a reason and a detail","a memorised speech"],1,"Answer, reason, detail. Sound natural."]];

const TP={G:"Grammar: read the whole sentence first. Check the subject and verb agreement, then look for time words (since, by, if) before choosing.",V:"Vocabulary: learn words in collocations (draw a conclusion, make a decision), not alone. Write one sentence for each new word.",R:"Reading: for True, False and Not Given, first ask if the passage mentions the idea at all. If it never does, the answer is Not Given.",W:"Writing and speaking: every answer needs a point, a reason and an example. In Task 1, always write an overview."};
const GT=["Review mistakes the next day, not the same day. It sticks better.","Ten focused minutes beat one tired hour.","Say new words aloud once. It helps both speaking and memory.","Spend no more than 1.5 minutes on one Reading question. Mark it and come back."];
const unseen=c=>QB.map((_,i)=>i).filter(i=>!S.seen[i]&&(!c||QB[i][0]===c));
function qstart(c){qz={cat:c,l:unseen(c).sort(()=>Math.random()-.5).slice(0,10),i:0,sc:0,a:null,miss:[]};if(!qz.l.length)qz={empty:1};go("quiz")}
function qpick(i){const id=qz.l[qz.i],q=QB[id],c=q[0];qz.a=i;S.seen[id]=1;S.qs[c]=S.qs[c]||{a:0,c:0};S.qs[c].a++;if(i===q[3]){qz.sc++;S.qs[c].c++}else{qz.miss.push(id);S.mist.unshift({q:q[1],a:q[2][i],c:q[2][q[3]],n:q[4]});S.mist=S.mist.slice(0,50)}save();draw()}

function quizv(){
if(!qz)return `<h2>Quiz</h2><p class="mu">Questions do not repeat until you reset.</p><div class="tiles">${[["","Mixed"],["G","Grammar"],["V","Vocabulary"],["R","Reading"],["W","Writing"]].map(c=>`<button class="tile ${c[0]?"b":""}" onclick="qstart('${c[0]}')">${c[1]}<small>${unseen(c[0]).length} left</small></button>`).join("")}</div><div class="card"><button class="alt" onclick="if(confirm('Mark all questions as new again?')){S.seen={};save();draw()}">Reset question history</button></div>`;
if(qz.empty)return `<div class="card mong">${mong("sleeping",72)}<p>You have finished every question in this set. Reset the history, or ask Claude for a bigger bank.</p></div><button onclick="qz=null;draw()">Back</button>`;
if(qz.i>=qz.l.length){const n=qz.l.length,by={};qz.miss.forEach(i=>{const c=QB[i][0];by[c]=(by[c]||0)+1});const wk=Object.keys(by).sort((a,b)=>by[b]-by[a])[0];
return `<div class="card"><div class="mong">${mong(qz.sc>=n*.7?"proud":"encouraging")}<div class="bubble">${qz.sc} of ${n} correct.</div></div></div><div class="card"><h3>Pocket tip</h3><p>${wk?TP[wk]:"Strong set. Keep your pace and try the next one."}</p><p class="mu">${GT[Math.floor(Math.random()*GT.length)]}</p></div>${qz.miss.length?`<div class="card"><h3>Review your mistakes</h3>${qz.miss.map(i=>`<p><b>${esc(QB[i][1])}</b><br><span class="mu">Answer: ${esc(QB[i][2][QB[i][3]])}. ${esc(QB[i][4])}</span></p>`).join("")}</div>`:""}<div class="row"><button onclick="qstart('${qz.cat}')">Next 10</button><button class="alt" onclick="qz=null;draw()">Menu</button></div>`}

const SP=[["Part 1",["Describe your hometown.","What do you usually do on weekends?","Do you prefer studying alone or with others?","What kind of food do you enjoy cooking?","How do you use technology every day?","Tell me about your daily routine.","What hobbies do you have?","Do you like travelling? Why?"]],

["Part 3",["Why do some people prefer paper books?","How might technology change education in the future?","Do young people travel more than older people? Why?","What are the pros and cons of working from home?","How can governments encourage people to live healthier lives?","Is it more important to be talented or hardworking?"]]];
function spStop(){clearInterval(st);st=null;sph=""}

async function recTog(){const b=$("#rb");if(rec&&rec.state==="recording"){rec.stop();return}
try{const s=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];rec=new MediaRecorder(s);rec.ondataavailable=e=>chunks.push(e.data);rec.onstop=()=>{s.getTracks().forEach(t=>t.stop());const a=$("#pl");if(!a)return;a.src=URL.createObjectURL(new Blob(chunks,{type:rec.mimeType}));a.style.display="block";b.textContent="Record again"};rec.start();b.textContent="Stop"}catch(e){alert("Microphone is not available. Please allow microphone access in your browser settings.")}}

const DECK=["mitigate|mengurangi dampak|Trees help mitigate the heat.","substantial|cukup besar|Sales showed a substantial rise.","fluctuate|naik turun|Prices fluctuate every year.","ubiquitous|ada di mana-mana|Phones are ubiquitous.","crucial|sangat penting|Sleep plays a crucial role.","alleviate|meringankan|Aid can alleviate poverty.","sustainable|berkelanjutan|We need sustainable energy.","inevitable|tak terelakkan|Change is inevitable.","consequence|akibat|Pollution has serious consequences.","diminish|berkurang|Interest began to diminish.","enhance|meningkatkan|Reading enhances vocabulary.","phenomenon|fenomena|Urbanisation is a global phenomenon.","obstacle|hambatan|Cost is the main obstacle.","perspective|sudut pandang|Consider another perspective.","contribute|menyumbang|Cars contribute to smog.","emphasise|menekankan|The report emphasises safety.","predominantly|terutama|The class is predominantly female.","adequate|memadai|Housing was not adequate.","implement|menerapkan|Schools implemented the plan.","demonstrate|menunjukkan|The data demonstrate a clear trend.","controversial|kontroversial|The law is controversial.","reluctant|enggan|Many are reluctant to change.","beneficial|bermanfaat|Exercise is beneficial.","prevalent|lazim|Obesity is prevalent.","deteriorate|memburuk|Air quality deteriorated.","allocate|mengalokasikan|Allocate time for review.","elaborate|menguraikan|Please elaborate on that point.","compelling|meyakinkan|She made a compelling argument.","trend|kecenderungan|Prices show an upward trend.","vulnerable|rentan|Children are vulnerable."].map(s=>{const p=s.split("|");return{w:p[0],m:p[1],e:p[2]}});
const allW=()=>DECK.concat(S.vocab.map(v=>({w:v.w,m:v.m,e:v.e})));const IV=[0,1,3,7,14,30];
const vdue=()=>allW().filter(w=>!S.vs[w.w]||S.vs[w.w].d<=day()).sort((a,b)=>((S.vs[a.w]||{}).t||0)-((S.vs[b.w]||{}).t||0));
